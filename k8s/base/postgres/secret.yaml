# DEV-ONLY placeholder credentials. Never apply this file as-is outside a
# local kind/Minikube cluster. For any real deployment, generate this Secret
# from AWS Secrets Manager / a sealed-secrets / SOPS pipeline instead of
# committing literal values to Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: employee-management
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres-dev-only-change-me
