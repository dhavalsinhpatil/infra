# DEV-ONLY placeholder credentials sourced from values.yaml. See the
# caveat comment on postgres.secrets in that file — never reuse these
# values outside a local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.secrets.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.secrets.password | quote }}
