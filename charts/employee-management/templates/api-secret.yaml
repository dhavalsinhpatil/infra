# DEV-ONLY placeholder credentials sourced from values.yaml. See the
# caveat comment on api.secrets in that file.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.api.secrets.dbUsername | quote }}
  DB_PASSWORD: {{ .Values.api.secrets.dbPassword | quote }}
  JWT_SECRET: {{ .Values.api.secrets.jwtSecret | quote }}
